# Stations vocatron knows by name.
# Copy a [[channel]] block to add one. freq_mhz is the station.
# The radio is tuned 250 kHz below that, so its DC spike misses the channel.
# mode: wfm (broadcast), am (airband, shortwave, CB), nfm (marine, handheld, repeater).
# List one group with: vocatron list --group airband

[[channel]]
name = "TRT_FM"
freq_mhz = 91.400
mode = "wfm"
bw_khz = 200
group = "broadcast"
description = "TRT FM"

